name: Build and Deploy SKAN Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SKAN Web project
        run: |
          mkdir -p extracted site
          unzip -q SKAN-Web.zip -d extracted

          test -f extracted/SKAN-Web/index.html
          test -f extracted/SKAN-Web/app.js
          test -f extracted/SKAN-Web/style.css
          test -f extracted/SKAN-Web/manifest.webmanifest

          cp -a extracted/SKAN-Web/. site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web project
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy SKAN Web
        id: deployment
        uses: actions/deploy-pages@v4
